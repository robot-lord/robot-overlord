<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rlord overlord</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ccc; font: 13px system-ui, sans-serif; }
  #wrap { position: fixed; inset: 0; padding: 8px; box-sizing: border-box; display: flex; flex-direction: column; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 0 4px 6px; }
  #bar b { color: #d7a6f5; }
  #status { margin-left: auto; opacity: .8; }
  #status.bad { color: #f88; }
  #term { flex: 1; min-height: 0; border: 1px solid #333; border-radius: 6px; padding: 4px; background: #000; }
</style>
</head>
<body>
<div id="wrap">
  <div id="bar"><b>◆ overlord</b><span id="target"></span><span id="status">connecting…</span></div>
  <div id="term"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script>
const term = new Terminal({ cursorBlink: true, fontSize: 14, allowProposedApi: false,
  fontFamily: 'Menlo, "SF Mono", monospace', scrollback: 0 });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open(document.getElementById('term'));
fit.fit();
term.focus();

const statusEl = document.getElementById('status');
const targetEl = document.getElementById('target');
const enc = new TextEncoder();
let ws = null, backoff = 250;
const say = (s, bad) => { statusEl.textContent = s; statusEl.className = bad ? 'bad' : ''; };

function send(bytes) { if (ws && ws.readyState === 1) ws.send(bytes); }
term.onData(d => send(enc.encode(d)));
// Mouse reports in X10 encoding can carry bytes > 127: send them raw.
term.onBinary(d => send(Uint8Array.from(d, c => c.charCodeAt(0))));
term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ resize: [cols, rows] })); });
new ResizeObserver(() => fit.fit()).observe(document.getElementById('term'));

function connect() {
  const url = new URL('ws', location.href);
  url.protocol = 'ws:';
  url.search = `?cols=${term.cols}&rows=${term.rows}`;
  ws = new WebSocket(url);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { say('connected'); backoff = 250; term.reset(); };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') {
      const m = JSON.parse(ev.data);
      if (m.target) targetEl.textContent = m.target;
      if (m.error) say(m.error, true);
      return;
    }
    term.write(new Uint8Array(ev.data));
  };
  ws.onclose = () => {
    if (statusEl.className !== 'bad') say(`disconnected; retrying in ${backoff} ms`, true);
    setTimeout(connect, backoff);
    backoff = Math.min(backoff * 2, 5000);
  };
}
connect();
</script>
</body>
</html>
