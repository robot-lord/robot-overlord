# Spike: drive the rlord overlord from a browser over a localhost PTY bridge.
# Its own workspace so the main build, lockfile and CI never see it.
# Findings: docs/working/web-ui-spike.md.
[package]
name = "rlord-web-spike"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
portable-pty = "0.9"
serde_json = "1"
futures-util = "0.3"
