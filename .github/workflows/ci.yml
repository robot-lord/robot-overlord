name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  # Every PR ships a release (CLAUDE.md), so it must bump the version.
  # Linux on purpose: this needs only git and cargo, and macOS minutes cost 10x.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The toolchain, components and targets in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Not `cargo xtask` (--locked): a stale Cargo.lock must reach the
      # check, which says to commit it.
      - run: cargo run --package xtask -- check-version-bump "origin/${{ github.base_ref }}" HEAD
  # Linux on purpose: nothing here needs macOS, and macOS minutes cost 10x.
  # Release binaries are built by release.yml (stable) or `cargo xtask release` (dev).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The toolchain, components and targets in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # No HTTP, websocket or TLS code in the rlord binary: the opt-in web
      # plugin (crates/web) holds it.
      - run: cargo xtask check-deps
      - run: cargo test --workspace
        env:
          RLORD_TMUX_TESTS: "1"
  # The web plugin's page (crates/web/ui, TypeScript): its pinned Node
  # tools, installed with `npm ci --ignore-scripts`, then rlord-web's tests
  # against the built page rather than the placeholder. Node is needed here
  # only; `check` builds rlord-web with the placeholder page.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/web/ui/.node-version
          package-manager-cache: false
      # The toolchain, components and targets in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo xtask web install
      # Types (tsc), lint (oxlint, type-aware), format (biome), unit tests (vitest).
      - run: cargo xtask web check
      - run: cargo xtask web build
      - run: cargo test -p robot-overlord-web
        env:
          RLORD_WEB_REQUIRE_ASSETS: "1"
  # Known-vulnerable dependencies (RustSec advisories) fail the build.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
