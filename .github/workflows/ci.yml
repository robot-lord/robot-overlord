name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every PR ships a release (CLAUDE.md), so it must bump the version.
  # Linux on purpose: this needs only git, and macOS minutes cost 10x.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/check-version-bump.sh "origin/${{ github.base_ref }}" HEAD
  # Linux on purpose: nothing here needs macOS, and macOS minutes cost 10x.
  # Release binaries are built locally (scripts/release.sh), not in CI.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          RLORD_TMUX_TESTS: "1"
