name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here needs to write to the repo.
permissions:
  contents: read

jobs:
  # Every PR ships a release (CLAUDE.md), so it must bump the version.
  # Linux on purpose: this needs only git and cargo, and macOS minutes cost 10x.
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Not `cargo xtask` (--locked): a stale Cargo.lock must reach the
      # check, which says to commit it.
      - run: cargo run --package xtask -- check-version-bump "origin/${{ github.base_ref }}" HEAD
  # Linux on purpose: nothing here needs macOS, and macOS minutes cost 10x.
  # Release binaries are built by release.yml (stable) or `cargo xtask release` (dev).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          RLORD_TMUX_TESTS: "1"
  # Known-vulnerable dependencies (RustSec advisories) fail the build.
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
