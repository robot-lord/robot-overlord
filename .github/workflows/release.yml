# Stable releases (X.Y.Z) are built here, so anyone can see how the binaries
# were made. `cargo xtask release` pushes the tag, waits for this run, then
# updates the Homebrew tap and crates.io locally. Dev builds (X.Y.Z-dev.N)
# are not built here: `cargo xtask release` builds them on the maintainer's
# Mac.
#
# The build commands live in `cargo xtask build-release` (xtask/src/build.rs),
# shared with the local fallback (`cargo xtask release --local`); the
# version rules, targets and asset names in xtask/src/version.rs; the
# packaging tools' versions in xtask/src/tools.rs; Rust's in
# rust-toolchain.toml. No build
# cache: release binaries are built from scratch so a poisoned cache can't
# reach them.
name: release
# `cargo xtask release` finds a release's run by this title: "release vX.Y.Z",
# with " (dry run)" on runs that publish nothing.
run-name: release ${{ inputs.tag || github.ref_name }}${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && ' (dry run)' || '' }}
on:
  push:
    # Whole-ref match: -dev tags don't trigger.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (vX.Y.Z). Empty builds the selected branch.
        type: string
        default: ''
      dry_run:
        description: Build and test everything; upload workflow artifacts only, no GitHub Release.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # A tag push publishes; a manual run only when dry_run is off. Anything
  # else is a dry run.
  DRY_RUN: ${{ !((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && 'true' || 'false' }}
  REF: ${{ inputs.tag || github.ref }}
  CARGO_TERM_COLOR: always

jobs:
  # Fail fast, before any build: only merged code, a stable version, the
  # tag matching Cargo.toml. A dry run reports these as warnings. A tag
  # whose release already exists (made by `cargo xtask release --local`) is
  # skipped, so a local fallback never races this workflow. The checks are
  # xtask/src/preflight.rs.
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tag: ${{ steps.check.outputs.tag }}
      assets: ${{ steps.check.outputs.assets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
          fetch-depth: 0
      # The toolchain, components and targets in rust-toolchain.toml.
      - run: rustup toolchain install
      # Built in its own step and run directly (not through cargo), so no
      # crate build script runs with the token.
      - run: cargo build --locked --package xtask
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: target/debug/xtask release-preflight

  # The web plugin's page, built once here so Node stays off the jobs that
  # compile the binaries, and every target embeds identical bytes. Pinned
  # tools, lockfile integrity, no install scripts, no cache. The build jobs
  # take it through RLORD_WEB_DIST and embed it in each target's plugin.
  web-assets:
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: crates/web/ui/.node-version
          package-manager-cache: false
      # The toolchain, components and targets in rust-toolchain.toml (for xtask).
      - run: rustup toolchain install
      - run: cargo xtask web install
      - run: cargo xtask web check
      - run: cargo xtask web build
      # Not dist-*: the release job merges those into the release's files.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-page
          path: crates/web/ui/dist
          if-no-files-found: error

  # Each build job makes rlord-web first, then rlord with the plugin's
  # SHA-256 compiled in (xtask/src/build.rs), and checks that the rlord
  # takes its own plugin.
  build-macos:
    needs: [preflight, web-assets]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: macos-15
    # Holds the signing secrets; its required reviewers approve each run.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-page
          path: web-page
      # The toolchain, components and targets in rust-toolchain.toml.
      - run: rustup toolchain install
      # The Developer ID certificate and key into a throwaway keychain, so
      # the build signs with it (same code as a dev build on the Mac).
      - name: Import signing identity
        id: keychain
        env:
          P12: ${{ secrets.MACOS_SIGN_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          if [[ -z $P12 ]]; then
            if [[ $DRY_RUN == false ]]; then
              echo "::error::MACOS_SIGN_P12 is not set in the release environment"; exit 1
            fi
            echo "::warning::MACOS_SIGN_P12 not set: this dry run signs ad-hoc"
            exit 0
          fi
          kc_pass=$(openssl rand -hex 32)
          p12_file="$RUNNER_TEMP/rlord-signing.p12"
          printf '%s' "$P12" | base64 --decode > "$p12_file"
          security create-keychain -p "$kc_pass" "$RUNNER_TEMP/rlord-signing.keychain-db"
          security set-keychain-settings -lut 3600 "$RUNNER_TEMP/rlord-signing.keychain-db"
          security unlock-keychain -p "$kc_pass" "$RUNNER_TEMP/rlord-signing.keychain-db"
          security import "$p12_file" -k "$RUNNER_TEMP/rlord-signing.keychain-db" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12_file"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pass" "$RUNNER_TEMP/rlord-signing.keychain-db" > /dev/null
          # Ahead of the existing search list, which stays.
          existing=()
          while IFS= read -r k; do existing+=("$k"); done < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$RUNNER_TEMP/rlord-signing.keychain-db" "${existing[@]}"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: cargo xtask build-release macos dist
        env:
          # xtask/src/build.rs: a publishing run ("1") refuses to sign
          # ad-hoc; a dry run may, with a warning, without the secrets.
          RLORD_RELEASE: ${{ env.DRY_RUN == 'false' && '1' || 'dry-run' }}
          RLORD_WEB_DIST: ${{ github.workspace }}/web-page
      # The Developer ID signature, checked on the shipped binaries: rlord
      # and the web plugin (signed before rlord compiled in its hash).
      # -dvv: plain -dv prints no Authority lines.
      - name: Verify signature
        if: steps.keychain.outputs.signed == 'true'
        run: |
          set -o pipefail
          tmp=$(mktemp -d)
          for t in dist/*.tar.gz; do tar -xzf "$t" -C "$tmp"; done
          for name in rlord rlord-web; do
            bin=$(find "$tmp" -type f -name "$name" | head -n1)
            [[ -n $bin ]] || { echo "::error::no $name binary in the tarballs"; exit 1; }
            codesign --verify --strict "$bin"
            info=$(codesign -dvv "$bin" 2>&1)
            echo "$info"
            grep -q '^Authority=Developer ID Application: ' <<<"$info" || { echo "::error::$name is not signed with a Developer ID"; exit 1; }
            grep -qx "Identifier=com.robot-lord.$name" <<<"$info" || { echo "::error::$name has the wrong signing identifier"; exit 1; }
          done
      - name: Delete keychain
        if: always()
        run: |
          [[ -f $RUNNER_TEMP/rlord-signing.keychain-db ]] || exit 0
          security delete-keychain "$RUNNER_TEMP/rlord-signing.keychain-db"
          rm -f "$RUNNER_TEMP/rlord-signing.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  build-linux:
    needs: [preflight, web-assets]
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-page
          path: web-page
      # The toolchain, components and targets in rust-toolchain.toml.
      - run: rustup toolchain install
      # zig, cargo-zigbuild, cargo-deb and cargo-generate-rpm at the
      # versions pinned in xtask/src/tools.rs: prebuilt and checksum-checked
      # where the project ships a binary, otherwise `cargo install --locked`.
      - run: cargo xtask install-tools
      - run: cargo xtask build-release linux dist
        env:
          RLORD_WEB_DIST: ${{ github.workspace }}/web-page
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  # Install each build with get.sh on several distros, natively per arch,
  # and the web plugin beside it with `rlord web install --from`.
  smoke-linux:
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux
          path: dist
      # get.sh verifies the tarball against SHA256SUMS.
      - run: cd dist && sha256sum -- * > SHA256SUMS
      # For xtask, which runs the smoke test.
      - run: rustup toolchain install
      - run: scripts/smoke-linux.sh dist ubuntu:22.04 ubuntu:24.04 debian:12 fedora:41 amazonlinux:2023

  release:
    needs: [preflight, web-assets, build-macos, build-linux, smoke-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the GitHub Release
      id-token: write # provenance attestations
      attestations: write
    # No checkout: the tag and the expected files come from preflight, the
    # files themselves from the builds.
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      ASSETS: ${{ needs.preflight.outputs.assets }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Check assets
        run: |
          [[ -n $ASSETS ]] || { echo "::error::preflight listed no assets"; exit 1; }
          for f in $ASSETS; do
            [[ -f dist/$f ]] || { echo "::error::missing $f"; ls dist; exit 1; }
          done
      - run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - if: env.DRY_RUN == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/*
      # A draft: `cargo xtask release` publishes it after checking checksums
      # and provenance. A draft left by an earlier failed run is replaced.
      - if: env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2>/dev/null) == true ]]; then
            gh release delete "$TAG" -R "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --draft --title "$TAG" --generate-notes
