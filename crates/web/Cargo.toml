# The opt-in web UI plugin, `rlord-web`: the HTTP server, websockets, PTY
# bridge and embedded page. A separate executable so the `rlord` binary has
# no network code (`cargo xtask check-deps` holds it to that). Never
# published, never in the rlord tarball or packages
# (docs/working/web-ui-remote.md).
[package]
name = "robot-overlord-web"
description = "rlord's opt-in web UI plugin (rlord-web). Not a stable API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rlord-web"
path = "src/main.rs"

[dependencies]
rlord-core = { package = "robot-overlord-core", path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
libc.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Constant-time token compare.
subtle = "2"

[dev-dependencies]
rlord-daemon = { package = "robot-overlord-daemon", path = "../daemon" }
tempfile = "3"
tokio-tungstenite = "0.29"
