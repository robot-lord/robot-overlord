<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The app's shell sends the same policy as a header, with frame-ancestors (a meta can't). -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>rlord</title>
  </head>
  <body class="phone">
    <div id="app"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
