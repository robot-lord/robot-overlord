# The relay (`rlord-relay`): a public server that hosts and devices dial
# out to, which splices their links and queues a little mailbox traffic. It
# sees only ciphertext and metadata: no content crypto, none of rlord's own
# crates (`cargo xtask check-deps` holds it to that). Released as Linux
# tarballs and a container image, never on crates.io. See docs/relay.md and
# docs/working/e2e-protocol.md.
[package]
name = "robot-overlord-relay"
description = "rlord's relay server (rlord-relay). Not a stable API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "rlord_relay"

[[bin]]
name = "rlord-relay"
path = "src/main.rs"

[dependencies]
rlord-relay-proto = { package = "robot-overlord-relay-proto", path = "../relay-proto" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rusqlite.workspace = true
toml.workspace = true
clap.workspace = true
libc.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The versions relay-proto's p256 resolves, so no duplicates.
sha2 = { version = "0.11", default-features = false }
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
