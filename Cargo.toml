[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/tui", "crates/rlord"]

[workspace.package]
version = "0.22.0-dev.11"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robot-lord/robot-overlord"
homepage = "https://github.com/robot-lord/robot-overlord"
authors = ["ayersb"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.42", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ulid = "3"
ratatui = "0.30"
ansi-to-tui = "8"
uuid = { version = "1", features = ["v4"] }
toml = "1.2"
toml_edit = "0.25"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
