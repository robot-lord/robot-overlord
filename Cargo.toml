[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/tui",
    "crates/rlord",
    "crates/web",
    "crates/e2e",
    "crates/e2e-wasm",
    "crates/relay-proto",
    "crates/e2e-client",
    "crates/e2e-device",
    "crates/relay",
    "crates/e2e-ffi",
    "xtask",
]
# Plain `cargo build`/`cargo run`/`cargo test` at the root leave xtask and
# the web plugin (`rlord-web`, opt-in, never in the rlord binary) out;
# `--workspace` includes them (CI uses it).
default-members = ["crates/core", "crates/daemon", "crates/tui", "crates/rlord"]

[workspace.package]
version = "1.16.0-dev.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robot-lord/robot-overlord"
homepage = "https://github.com/robot-lord/robot-overlord"
authors = ["ayersb"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.43", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ulid = "3"
ratatui = "0.30"
ansi-to-tui = "8"
uuid = { version = "1", features = ["v4"] }
toml = "1.2"
toml_edit = "0.25"
thiserror = "2"
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
