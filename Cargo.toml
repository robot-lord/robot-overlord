[workspace]
resolver = "2"
members = ["crates/core", "crates/daemon", "crates/tui", "crates/rlord"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ayersb/robot-overlord"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ulid = "1"
ratatui = "0.29"
ansi-to-tui = "7"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
